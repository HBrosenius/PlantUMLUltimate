name: Deploy collaboration service

on:
  push:
    branches: [main]
    paths:
      - "apps/collaboration-worker/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-collaboration.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: collaboration-worker
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm --workspace @plantuml-studio/collaboration-worker run test
      - run: npm --workspace @plantuml-studio/collaboration-worker run typecheck
      - name: Disable unrelated Chrome APT source
        run: |
          if [ -f /etc/apt/sources.list.d/google-chrome.list ]; then
            sudo mv /etc/apt/sources.list.d/google-chrome.list /tmp/google-chrome.list.disabled
          fi
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:collaboration
      - name: Report missing deployment credentials
        if: ${{ env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == '' }}
        run: echo "::warning::Collaboration Worker was validated but not deployed because Cloudflare repository secrets are missing."
      - name: Deploy collaboration Worker
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: npx wrangler deploy --config apps/collaboration-worker/wrangler.jsonc --minify
