name: Deploy Jira integration service

on:
  push:
    branches: [main]
    paths:
      - "apps/integration-worker/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-integration.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration-worker
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm --workspace @plantuml-studio/integration-worker run test
      - run: npm --workspace @plantuml-studio/integration-worker run typecheck
      - name: Report missing deployment credentials
        if: ${{ env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == '' }}
        run: echo "::warning::Jira integration Worker was validated but not deployed because Cloudflare repository secrets are missing."
      - name: Apply D1 migrations
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: npx wrangler d1 migrations apply plantuml-ultimate-jira --remote --config apps/integration-worker/wrangler.jsonc
      - name: Deploy Jira integration Worker
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: npx wrangler deploy --config apps/integration-worker/wrangler.jsonc --minify
